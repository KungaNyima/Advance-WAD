<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Management System</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>

<div class="container">
  <h1>Student Management System</h1>

  <p id="message" class="message"></p>
  <p id="loading" class="loading">Loading...</p>

  <!-- FORM -->
  <form id="studentForm">
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="full_name" />
      <span class="error-msg" id="full_name_error"></span>
    </div>

    <div class="form-group">
      <label>Age</label>
      <input type="number" id="age" />
      <span class="error-msg" id="age_error"></span>
    </div>

    <div class="form-group">
      <label>Address</label>
      <input type="text" id="address" />
      <span class="error-msg" id="address_error"></span>
    </div>

    <div class="form-group">
      <label>Level</label>
      <select id="level">
        <option value="">Select Level</option>
        <option value="bachelor">Bachelor</option>
        <option value="master">Master</option>
      </select>
      <span class="error-msg" id="level_error"></span>
    </div>

    <div class="form-group">
      <label>Phone Number</label>
      <input type="text" id="phone_number" />
      <span class="error-msg" id="phone_error"></span>
    </div>

    <div class="form-group">
      <label>Joined Date</label>
      <input type="date" id="joined_date" />
      <span class="error-msg" id="joined_date_error"></span>
    </div>

    <div class="form-group">
      <label>Expected Graduation Date</label>
      <input type="date" id="expected_graduation_date" />
      <span class="error-msg" id="grad_date_error"></span>
    </div>

    <button type="submit">Save Student</button>
    <button type="button" id="cancelBtn" style="display:none;">Cancel</button>
  </form>

  <!-- CONTROLS -->
  <div class="controls">
    <input type="text" id="searchInput" placeholder="Search by name..." />
    <select id="filterLevel">
      <option value="">All Levels</option>
      <option value="bachelor">Bachelor</option>
      <option value="master">Master</option>
    </select>
    <button type="button" onclick="sortByAge()">Sort by Age</button>
  </div>

  <!-- TABLE -->
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Age</th>
        <th>Level</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="studentsTable"></tbody>
  </table>
</div>

<!-- Student Details Modal -->
<div id="studentModal" class="modal">
  <div class="modal-content">
    <span class="close-btn">&times;</span>
    <h2>Student Details</h2>
    <p><strong>Full Name:</strong> <span id="modal_full_name"></span></p>
    <p><strong>Age:</strong> <span id="modal_age"></span></p>
    <p><strong>Address:</strong> <span id="modal_address"></span></p>
    <p><strong>Level:</strong> <span id="modal_level"></span></p>
    <p><strong>Phone Number:</strong> <span id="modal_phone"></span></p>
    <p><strong>Joined Date:</strong> <span id="modal_joined_date"></span></p>
    <p><strong>Expected Graduation Date:</strong> <span id="modal_grad_date"></span></p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
