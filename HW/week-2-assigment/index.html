<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Week 2 — Events HW</title>
    <link rel="stylesheet" href="styles.css" />
    <script defer src="app.js"></script>
</head>

<body>
    <main class="container">
        <h1>Events Practice</h1>

        <section class="card">
            <label for="userInput">Type something:</label>
            <input id="userInput" placeholder="Start typing…" />
            <p class="hint">As you type, the text below should update live.</p>
            <p id="mirror" class="out"></p>

            <button id="actionBtn" type="button">Show Value</button>
            <p class="hint">On click: log to Console and show an alert.</p>
        </section>
    </main>
</body>

</html>
