<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 7 Homework - Form Validation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="form-header">
            <h1>Registration Form</h1>
            <p>Complete the validation in app.js</p>
        </div>

        <div class="form-wrapper">
            <form id="registrationForm" novalidate>
                <!-- Name Fields -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First Name:</label>
                        <input type="text" id="firstName" placeholder="Enter first name">
                        <span class="error" aria-live="polite"></span>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name:</label>
                        <input type="text" id="lastName" placeholder="Enter last name">
                        <span class="error" aria-live="polite"></span>
                    </div>
                </div>

                <!-- Email and Age -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Email Address:</label>
                        <input type="email" id="email" placeholder="your@email.com">
                        <span class="error" aria-live="polite"></span>
                    </div>
                    <div class="form-group">
                        <label for="age">Age:</label>
                        <input type="number" id="age" placeholder="Enter age">
                        <span class="error" aria-live="polite"></span>
                    </div>
                </div>

                <!-- Address -->
                <div class="form-group">
                    <label for="address">Street Address:</label>
                    <input type="text" id="address" placeholder="123 Main Street">
                    <span class="error" aria-live="polite"></span>
                </div>

                <!-- City, County, Zipcode -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="city">City:</label>
                        <input type="text" id="city" placeholder="Enter city">
                        <span class="error" aria-live="polite"></span>
                    </div>
                    <div class="form-group">
                        <label for="county">County:</label>
                        <input type="text" id="county" placeholder="Enter county">
                        <span class="error" aria-live="polite"></span>
                    </div>
                    <div class="form-group">
                        <label for="zipcode">Zip Code:</label>
                        <input type="text" id="zipcode" placeholder="12345">
                        <span class="error" aria-live="polite"></span>
                    </div>
                </div>

                <button type="submit">Submit</button>
            </form>

            <div class="success-message" id="successMessage" style="display: none;">
                Form submitted successfully!
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
